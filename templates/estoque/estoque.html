{% extends 'base.html' %}

{% load static %}

{% block title %}Estoque{% endblock %}

{% block main %}
    <h1>Estoque</h1>
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade Disponível</th>
            </tr>
        </thead>
        <tbody>
            {% for estoque in estoques %}
                <tr onclick="redirectToView('{{ estoque.pk }}')">
                    <td>{{ estoque.produto.nome }}</td>
                    <td>{{ estoque.quantidade }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
