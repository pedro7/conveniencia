<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
</head>
<body>
    <main>
        <form method="post" action="{% url 'adicionar_produto' %}">
            {% csrf_token %}
            <input type="text" name="codigo_barras" maxlength="13" placeholder="Código de Barras">
            <input type="submit" value="Adicionar no Carrinho">
        </form>
        {% for message in messages %}
            {{ message }}
        {% endfor %}
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Remover</th>
                </tr>
            </thead>
            <tbody>
                {% for produto in carrinho %}
                    <tr>
                        <td>{{ produto.nome }}</td>
                        <td>{{ produto.preco }}</td>
                        <td>
                            <form method="post" action="{% url 'remover_produto' forloop.counter %}">
                                {% csrf_token %}
                                <input type="submit" value="Remover">
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
            {% if total > 0 %}
                <tfoot>
                    <tr>
                        <td>Total: {{ total }}</td>
                    </tr>
                </tfoot>
            {% endif %}
        </table>
        <form method="post" action="{% url 'limpar_carrinho' %}">
            {% csrf_token %}
            <input type="submit" value="Limpar">
        </form>
        <form method="post" action="{% url 'finalizar_compra' %}">
            {% csrf_token %}
            <input type="text" name="login" placeholder="Login">
            <input type="password" name="senha" placeholder="Senha">
            <input type="submit" value="Finalizar">
        </form>
    </main>
</body>
</html>
