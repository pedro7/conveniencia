{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="{% static 'css/entrar.css' %}">
</head>
<body>
    <main>
        <div class="container">
            <h2>Login</h2>
            <form method="post" action="{% url 'entrar' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Entrar</button>
            </form>
            {% for message in messages %}
                <div class="erro">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
