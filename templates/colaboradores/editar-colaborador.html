{% extends 'base.html' %}

{% block title %}Editar Colaborador{% endblock %}

{% block main %}
    <form method="post" action="{% url 'editar_colaborador' colaborador.login %}">
        {% csrf_token %}
        <input type="text" value="{{ colaborador.nome }}" name="nome" placeholder="Nome">
        <input type="text" value="{{ colaborador.cpf }}" name="cpf" placeholder="CPF">
        <input type="text" value="{{ colaborador.login }}" name="login" placeholder="Login">
        <input type="password" name="senha" placeholder="Senha">
        <input type="submit" value="Editar">
        <a href="{% url 'colaboradores' %}">Cancelar</a>
    </form>
{% endblock %}
