{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Base{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <!-- <link rel="stylesheet" href="{% static 'css/styles.css' %}"> -->
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
</head>
<body id="body-pd">
    <header class="header" id="header">
        <div class="header_toggle">
            <i class='bx bx-menu' id="header-toggle"></i>
        </div>
        <!-- <div class="header_img">
            <img src="https://i.imgur.com/hczKIze.jpg" alt="">
        </div> -->
    </header>
    <div class="l-navbar" id="nav-bar">
        <nav class="nav">
            <div>
                <a href="{% url 'visualizar_painel' %}" class="nav_logo">
                    <i class='bx bx-layer nav_logo-icon'></i>
                    <span class="nav_logo-name">Lojinha SCI</span>
                </a>
                <div class="nav_list">
                    <a href="{% url 'visualizar_painel' %}" class="nav_link">
                        <i class='bx bx-grid-alt nav_icon'></i>
                        <span class="nav_name">Painel</span>
                    </a>
                    <a href="{% url 'visualizar_colaboradores' %}" class="nav_link">
                        <i class='bx bx-user nav_icon'></i>
                        <span class="nav_name">Colaboradores</span>
                    </a>
                    <a href="{% url 'visualizar_produtos' %}" class="nav_link">
                        <i class='bx bx-message-square-detail nav_icon'></i>
                        <span class="nav_name">Produtos</span>
                    </a>
                    {% if request.user.is_superuser %}
                        <a href="{% url 'visualizar_usuarios' %}" class="nav_link">
                            <i class='bx bx-bookmark nav_icon'></i>
                            <span class="nav_name">Usuários</span>
                        </a>
                        <a href="{% url 'visualizar_compras' %}" class="nav_link">
                            <i class='bx bx-folder nav_icon'></i>
                            <span class="nav_name">Compras</span>
                        </a>
                        <a href="{% url 'visualizar_relatorios' %}" class="nav_link">
                            <i class='bx bx-bar-chart-alt-2 nav_icon'></i>
                            <span class="nav_name">Relatórios</span>
                        </a>
                    {% endif %}
                </div>
            </div>
            <a href="{% url 'sair' %}" class="nav_link">
                <i class='bx bx-log-out nav_icon'></i>
                <span class="nav_name">Sair</span>
            </a>
        </nav>
    </div>
    <main>
        <div class="height-100 bg-light">
            {% block main %}

            {% endblock %}
        </div>
    </main>
    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/sidebar.js' %}"></script>
</body>
</html>
