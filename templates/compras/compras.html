{% extends 'base.html' %}

{% block title %}Compras{% endblock %}

{% block main %}
    <table>
        <thead>
            <tr>
                <th>Colaborador</th>
                <th>Data</th>
                <th>Produtos</th>
                <th>Excluir</th>
            </tr>
        </thead>
        <tbody>
            {% for compra in compras %}
                <tr>
                    <td>{{ compra.colaborador.nome }}</td>
                    <td>{{ compra.data }}</td>
                    <td>
                        
                    </td>
                    <td>
                        <form method="post" action="{% url 'excluir_compra' compra.id %}">
                            {% csrf_token %}
                            <input type="submit" value="Excluir">
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
        <tfoot>

        </tfoot>
    </table>
{% endblock %}
