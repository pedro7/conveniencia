{% extends 'base.html' %}

{% block title %}Produtos{% endblock %}

{% block main %}
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Código de Barras</th>
                <th>Preço</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody>
            {% for produto in produtos %}
                <tr onclick="redirectToView('{{ produto.codigo_barras }}')">
                    <td>{{ produto.nome }}</td>
                    <td>{{ produto.codigo_barras }}</td>
                    <td>{{ produto.preco }}</td>
                    <td>{{ produto.situacao }}</td>
                </tr>
            {% endfor %}
        </tbody>
        <tfoot>

        </tfoot>
    </table>
{% endblock %}
